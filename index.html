/* ============================================================
   VELIONIX DASHBOARD — Estilos

:root {
  --bg: #08080a;
  --bg-2: #0c0c0f;
  --bg-3: #131316;

  --cyan: #c7cad1;

  --ring: 0 0 0 3px rgba(212, 175, 90, 0.25);
}

[data-theme="light"] {
  --bg: #f7f6f2;
  --bg-2: #f0eee7;
  --bg-3: #ffffff;
  --surface: rgba(255, 255, 255, 0.82);
  --surface-2: rgba(255, 255, 255, 0.96);
  --surface-solid: #ffffff;
  --surface-hover: rgba(0, 0, 0, 0.03);
  --border: rgba(120, 96, 40, 0.14);
  --border-strong: rgba(120, 96, 40, 0.22);
  --text: #1a1917;
  --text-muted: #56534b;
  --text-subtle: #837e72;
  --accent: #9a7626;
  --accent-2: #7e5f1c;
  --accent-soft: rgba(154, 118, 38, 0.1);
  --accent-glow: rgba(154, 118, 38, 0.2);
  --cyan: #5a5d66;
  --cyan-soft: rgba(90, 93, 102, 0.1);
  --amber: #b7862f;
  --amber-soft: rgba(183, 134, 47, 0.1);
  --amber-glow: rgba(183, 134, 47, 0.15);
  --violet: #6b6e7d;
  --violet-soft: rgba(107, 110, 125, 0.1);
  --rose: #a1493f;
  --rose-soft: rgba(161, 73, 63, 0.1);
  --emerald: #4f7a4a;
  --emerald-soft: rgba(79, 122, 74, 0.1);
  --shadow: 0 4px 24px -8px rgba(26, 25, 23, 0.12);
  --shadow-lg: 0 24px 48px -16px rgba(26, 25, 23, 0.18);
  --ring: 0 0 0 3px rgba(154, 118, 38, 0.2);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background 0.4s ease, color 0.3s ease;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(900px 500px at 85% -5%, var(--accent-soft), transparent 55%),
    radial-gradient(700px 400px at 5% 100%, var(--cyan-soft), transparent 50%),
    radial-gradient(500px 300px at 50% 50%, var(--violet-soft), transparent 60%);
  pointer-events: none;

  opacity: 0.7;
}
[data-theme="light"] body::before { opacity: 0.5; }

h1, h2, h3, p { margin: 0; }
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }
::selection { background: var(--accent-soft); color: var(--accent); }

.app { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 24px 20px 80px; }

/* ---------- Header ---------- */
.header {
  position: sticky; top: 0; z-index: 30;
  margin: -24px -20px 28px;
  padding: 16px 20px;
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header-inner { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand-mark {
  width: 46px; height: 46px;

}
.brand-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
.brand-text h1 {
  font-family: "Space Grotesk", sans-serif;
  font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1;
  background: linear-gradient(135deg, var(--text), var(--text-muted));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.brand-text p { font-size: 12px; color: var(--text-subtle); font-weight: 500; margin-top: 3px; letter-spacing: 0.02em; }
.header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.status-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 13px; border-radius: 999px;
  background: var(--emerald-soft); border: 1px solid rgba(52, 211, 153, 0.25);
  font-size: 12px; font-weight: 600; color: var(--emerald); white-space: nowrap;
}
.status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2); animation: pulse 2s ease-in-out infinite; }
.status-pill.error { background: var(--rose-soft); border-color: rgba(251, 113, 133, 0.25); color: var(--rose); }
.status-pill.error .dot { background: var(--rose); box-shadow: 0 0 0 3px rgba(251, 113, 133, 0.2); animation: none; }
.status-pill.loading { background: var(--amber-soft); border-color: rgba(251, 191, 36, 0.25); color: var(--amber); }
.status-pill.loading .dot { background: var(--amber); box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }

.last-updated { font-size: 12px; color: var(--text-subtle); font-weight: 500; white-space: nowrap; }
.last-updated span { color: var(--text-muted); font-weight: 600; }

.icon-btn {
  width: 38px; height: 38px; display: grid; place-items: center;
  border-radius: 10px; background: var(--surface-solid);
  border: 1px solid var(--border); color: var(--text-muted);
  transition: all 0.2s ease;
}
.icon-btn:hover { color: var(--accent); border-color: var(--accent-soft); transform: translateY(-1px); box-shadow: 0 4px 12px -4px var(--accent-glow); }
.icon-btn svg { width: 18px; height: 18px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface-solid);
  color: var(--text); font-size: 13px; font-weight: 600; white-space: nowrap;
  transition: all 0.2s ease;
}
.btn:hover:not(:disabled) { border-color: var(--accent-soft); color: var(--accent); transform: translateY(-1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #0a0e1a; border-color: transparent;
  box-shadow: 0 6px 20px -6px var(--accent-glow);
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); color: #0a0e1a; }
.btn svg { width: 15px; height: 15px; }

.spinner { width: 15px; height: 15px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Section titles ---------- */
.section-title {
  font-family: "Space Grotesk", sans-serif;
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-subtle); margin: 32px 0 14px;
  display: flex; align-items: center; gap: 10px;
}
.section-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

/* ---------- KPI cards ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.card {
  position: relative; padding: 18px;
  border-radius: var(--radius);
  background: var(--surface);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
  opacity: 0; transition: opacity 0.3s ease;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--border-strong); }
.card:hover::before { opacity: 1; }
.card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
}
.card-icon svg { width: 19px; height: 19px; }
.card.cyan .card-icon { background: var(--cyan-soft); color: var(--cyan); }
.card.amber .card-icon { background: var(--amber-soft); color: var(--amber); }
.card.violet .card-icon { background: var(--violet-soft); color: var(--violet); }
.card.rose .card-icon { background: var(--rose-soft); color: var(--rose); }
.card.emerald .card-icon { background: var(--emerald-soft); color: var(--emerald); }
.card.cyan::before { background: linear-gradient(90deg, var(--cyan), transparent); }
.card.amber::before { background: linear-gradient(90deg, var(--amber), transparent); }
.card.violet::before { background: linear-gradient(90deg, var(--violet), transparent); }
.card.rose::before { background: linear-gradient(90deg, var(--rose), transparent); }
.card.emerald::before { background: linear-gradient(90deg, var(--emerald), transparent); }

.card-value { font-family: "Space Grotesk", sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin-bottom: 5px; font-variant-numeric: tabular-nums; }
.card-label { font-size: 12.5px; color: var(--text-muted); font-weight: 500; }
.card-sub { font-size: 11px; color: var(--text-subtle); margin-top: 8px; font-weight: 500; }
.cards .card:nth-child(1) { animation-delay: 0.02s; }
.cards .card:nth-child(2) { animation-delay: 0.06s; }
.cards .card:nth-child(3) { animation-delay: 0.10s; }
.cards .card:nth-child(4) { animation-delay: 0.14s; }
.cards .card:nth-child(5) { animation-delay: 0.18s; }
.cards .card:nth-child(6) { animation-delay: 0.22s; }
.cards .card:nth-child(7) { animation-delay: 0.26s; }
.cards .card:nth-child(8) { animation-delay: 0.30s; }
@keyframes cardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ---------- Score distribution ---------- */
.score-section { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .score-section { grid-template-columns: 1fr; } }

.panel {
  padding: 18px; border-radius: var(--radius);
  background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.panel-title { font-family: "Space Grotesk", sans-serif; font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--text); }

.score-bars { display: flex; flex-direction: column; gap: 10px; }
.score-row { display: flex; align-items: center; gap: 10px; }
.score-label { font-size: 12px; font-weight: 600; color: var(--text-muted); min-width: 64px; }
.score-track { flex: 1; height: 10px; border-radius: 999px; background: var(--surface-hover); border: 1px solid var(--border); overflow: hidden; }
.score-fill { display: block; height: 100%; width: 0%; border-radius: 999px; transition: width 1s cubic-bezier(0.22, 1, 0.36, 1); }
.score-fill.f-low { background: linear-gradient(90deg, var(--rose), #f43f5e); }
.score-fill.f-mid { background: linear-gradient(90deg, var(--amber), #f59e0b); }
.score-fill.f-high { background: linear-gradient(90deg, var(--accent), var(--cyan)); }
.score-count { font-size: 12px; font-weight: 700; color: var(--text); min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }

/* funnel */
.funnel { display: flex; flex-direction: column; gap: 6px; }
.funnel-row { display: flex; align-items: center; gap: 12px; }
.funnel-label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); min-width: 130px; }
.funnel-bar-wrap { flex: 1; }
.funnel-bar { height: 28px; border-radius: 8px; display: flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 700; color: #0a0e1a; transition: width 1s cubic-bezier(0.22, 1, 0.36, 1); white-space: nowrap; overflow: hidden; }
.funnel-val { font-size: 12px; font-weight: 700; color: var(--text); min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- States grid ---------- */
.states-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.state-chip {
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 4px;
  transition: all 0.2s ease;
}
.state-chip:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.state-chip .num { font-family: "Space Grotesk", sans-serif; font-size: 22px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.state-chip .lbl { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.state-chip .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 6px; }

/* ---------- Table ---------- */
.table-panel {
  margin-top: 14px; border-radius: var(--radius);
  background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden;
}
.toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.search { position: relative; flex: 1; min-width: 200px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-subtle); pointer-events: none; }
.search input {
  width: 100%; padding: 9px 12px 9px 36px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface-solid); color: var(--text);
  font-size: 13px; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.search input:focus { border-color: var(--accent); box-shadow: var(--ring); }
.search input::placeholder { color: var(--text-subtle); }
.select {
  padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface-solid); color: var(--text); font-size: 13px; font-weight: 500;
  outline: none; cursor: pointer; transition: border-color 0.2s;
}
.select:focus { border-color: var(--accent); box-shadow: var(--ring); }
.toolbar-label { font-size: 12px; color: var(--text-subtle); font-weight: 500; }

.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 920px; }
table.data thead th {
  position: sticky; top: 0; text-align: left; padding: 11px 16px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-subtle); background: var(--surface-solid);
  border-bottom: 1px solid var(--border); white-space: nowrap; user-select: none;
}
table.data thead th.sortable { cursor: pointer; }
table.data thead th.sortable:hover { color: var(--accent); }
table.data thead th .sort-ic { opacity: 0.35; margin-left: 4px; vertical-align: middle; display: inline-flex; }
table.data thead th.active .sort-ic { opacity: 1; color: var(--accent); }
table.data tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
table.data tbody tr { transition: background 0.15s ease; }
table.data tbody tr:hover { background: var(--surface-hover); }
table.data tbody tr:last-child td { border-bottom: none; }
.cell-name { font-weight: 600; }
.cell-dash { color: var(--text-subtle); }
.cell-link { color: var(--cyan); text-decoration: none; font-weight: 500; }
.cell-link:hover { text-decoration: underline; }

.tag { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.tag-cat { background: var(--cyan-soft); color: var(--cyan); }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; }
.b-nuevo { background: var(--cyan-soft); color: var(--cyan); }
.b-nuevo .dot { background: var(--cyan); }
.b-analizado { background: var(--violet-soft); color: var(--violet); }
.b-analizado .dot { background: var(--violet); }
.b-baja { background: rgba(100,116,139,0.12); color: var(--text-subtle); }
.b-baja .dot { background: var(--text-subtle); }
.b-pendiente { background: var(--amber-soft); color: var(--amber); }
.b-pendiente .dot { background: var(--amber); animation: pulse 2s infinite; }
.b-enviado { background: var(--cyan-soft); color: var(--cyan); }
.b-enviado .dot { background: var(--cyan); }
.b-seg { background: var(--violet-soft); color: var(--violet); }
.b-seg .dot { background: var(--violet); }
.b-interesado { background: var(--emerald-soft); color: var(--emerald); }
.b-interesado .dot { background: var(--emerald); }
.b-declinado { background: var(--rose-soft); color: var(--rose); }
.b-declinado .dot { background: var(--rose); }
.b-duda { background: var(--amber-soft); color: var(--amber); }
.b-duda .dot { background: var(--amber); }
.b-sin-respuesta { background: rgba(100,116,139,0.12); color: var(--text-subtle); }
.b-sin-respuesta .dot { background: var(--text-subtle); }
.b-descartado { background: rgba(100,116,139,0.08); color: var(--text-subtle); }
.b-descartado .dot { background: var(--text-subtle); }

.score-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 24px; border-radius: 7px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.score-high { background: var(--accent-soft); color: var(--accent); }
.score-mid { background: var(--amber-soft); color: var(--amber); }
.score-low { background: var(--rose-soft); color: var(--rose); }

/* pagination */
.pagination { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.page-info { font-size: 12px; color: var(--text-muted); font-weight: 500; }
.page-controls { display: flex; align-items: center; gap: 5px; }
.page-btn { min-width: 32px; height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-solid); color: var(--text-muted); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; transition: all 0.18s ease; }
.page-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent-soft); }
.page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.page-btn.active { background: var(--accent); border-color: var(--accent); color: #0a0e1a; }
.page-btn svg { width: 14px; height: 14px; }

/* states (loading/empty/error) */
.state-box { padding: 56px 24px; text-align: center; }
.state-icon { width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.state-icon.error { background: var(--rose-soft); color: var(--rose); }
.state-icon svg { width: 24px; height: 24px; }
.state-box h3 { font-family: "Space Grotesk", sans-serif; font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.state-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; max-width: 360px; margin-left: auto; margin-right: auto; }

/* skeleton */
.skeleton { background: linear-gradient(90deg, var(--border) 25%, var(--border-strong) 37%, var(--border) 63%); background-size: 400% 100%; animation: shimmer 1.3s ease-in-out infinite; border-radius: 6px; }
@keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
.sk-card { height: 120px; border-radius: var(--radius); }

/* toast */

function setStatus(kind, text) {
    const pill = $("#statusPill");
    pill.className = "status-pill " + kind;
    $("#statusText").textContent = text;
}

function setLoading(on) {
    const btn = $("#refreshBtn"),
        ic = $("#refreshIcon");
    btn.disabled = on;
    ic.innerHTML = on ? '<span class="spinner"></span>' : ICONS.refresh;
}

function toast(msg, type = "success") {
    const wrap = $("#toastWrap");
    const el = document.createElement("div");
    el.className = "toast " + type;
    el.innerHTML = (type === "success" ? ICONS.toastOk : ICONS.toastErr) + "<span>" + esc(msg) + "</span>";
    wrap.appendChild(el);
    setTimeout(() => { el.classList.add("out");
        setTimeout(() => el.remove(), 300); }, 2600);
}

function initTheme() {
    const saved = localStorage.getItem("velionix-theme");
    const theme = saved || "dark";
    applyTheme(theme);
}

function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    $("#themeBtn").innerHTML = theme === "dark" ? ICONS.sun : ICONS.moon;
    $("#themeBtn").setAttribute("data-tip", theme === "dark" ? "Modo claro" : "Modo oscuro");
    localStorage.setItem("velionix-theme", theme);
}

function animateCount(el, to, dur = 900, suffix = "") {
    const t0 = performance.now();

    function step(now) {
        const p = Math.min(1, (now - t0) / dur);
        const eased = 1 - Math.pow(1 - p, 3);
        const val = Math.round(to * eased);
        el.textContent = val.toLocaleString("es-ES") + suffix;
        if (p < 1) requestAnimationFrame(step);
        else el.textContent = to.toLocaleString("es-ES") + suffix;
    }
    requestAnimationFrame(step);
}

function sanitizeError(err) {
    const msg = err && err.message ? err.message : String(err || "Error desconocido");
    return msg.replace(/eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+/g, "[token]");

        state.loading = false;
        setLoading(false);
        setStatus("ok", "Conectado");
        $("#lastUpdated").textContent = fmtDate(new Date());
        populateFilters();
        applyFilters();
        renderAll();
        toast("Datos actualizados", "success");
    } catch (err) {
        console.error("[Velionix] ❌ Error:", err);
        state.loading = false;
        setLoading(false);
        state.error = sanitizeError(err);
        setStatus("error", "Error de conexión");
        renderError();
        toast("No se pudieron cargar los datos", "error");
    }
}

// ============================================================
// PROCESAMIENTO DE DATOS
// ============================================================

function computeStats() {
    const total = state.rows.length;
    const conEmail = state.rows.filter(r => has(r.email)).length;
    const conPhone = state.rows.filter(r => has(r.telefono)).length;
    const conWeb = state.rows.filter(r => has(r.website)).length;
    const aptos = state.rows.filter(r => {
        const p = parseFloat(r.puntaje_final);
        return !isNaN(p) && p >= 7;
    }).length;
    const pendientes = state.rows.filter(r => r.estado === 'pendiente_revision').length;
    const enviados = state.rows.filter(r => r.estado === 'enviado' || r.estado === 'seguimiento_pendiente_revision').length;
    const interesados = state.rows.filter(r => r.clasificacion === 'interesado').length;
    const avgScore = total ? (state.rows.reduce((s, r) => s + (parseFloat(r.puntaje_final) || 0), 0) / total) : 0;
    return { total, conEmail, conPhone, conWeb, aptos, pendientes, enviados, interesados, avgScore };
}

function populateFilters() {
    const states = new Set();
    const cats = new Set();
    state.rows.forEach(r => {
        if (has(r.estado)) states.add(r.estado);
        if (has(r.categoria)) cats.add(r.categoria);
    });
    const sSel = $("#stateFilter");
    const curS = sSel.value;
    sSel.innerHTML = '<option value="">Todos los estados</option>' +
        [...states].sort().map(s => {
            const m = STATE_META[s] || { label: s };
            return `<option value="${esc(s)}">${esc(m.label)}</option>`;
        }).join("");
    sSel.value = curS;
    const cSel = $("#categoryFilter");
    const curC = cSel.value;
    cSel.innerHTML = '<option value="">Todas las categorías</option>' +
        [...cats].sort((a, b) => a.localeCompare(b, "es")).map(cat => `<option value="${esc(cat)}">${esc(cat)}</option>`).join("");
    cSel.value = curC;
}

function applyFilters() {
    const term = state.search.trim().toLowerCase();
    let rows = state.rows.slice();
    if (state.stateFilter) rows = rows.filter(r => r.estado === state.stateFilter);
    if (state.categoryFilter) rows = rows.filter(r => r.categoria === state.categoryFilter);
    if (term) {
        rows = rows.filter(r => {
            const blob = [r.nombre, r.categoria, r.direccion, r.telefono, r.email, r.area, r.angulo_venta]
                .map(v => String(v ?? "").toLowerCase()).join(" ");
            return blob.includes(term);
        });
    }
    rows.sort((a, b) => {
        let av = a[state.sortKey],
            bv = b[state.sortKey];
        if (state.sortKey === "puntaje_final" || state.sortKey === "ranking" || state.sortKey === "facilidad_conversion") {
            av = parseFloat(av) || 0;
            bv = parseFloat(bv) || 0;
            return state.sortDir === "asc" ? av - bv : bv - av;
        }
        av = String(av ?? "").toLowerCase();
        bv = String(bv ?? "").toLowerCase();
        return state.sortDir === "asc" ? av.localeCompare(bv, "es") : bv.localeCompare(av, "es");
    });
    state.filtered = rows;
    state.page = 1;
}

function renderScoreBars() {
    const buckets = [
        { label: "1-3 (Bajo)", min: 1, max: 3.9, cls: "f-low" },
        { label: "4-6 (Medio)", min: 4, max: 6.9, cls: "f-mid" },
        { label: "7-8 (Alto)", min: 7, max: 8.9, cls: "f-high" },
        { label: "9-10 (Top)", min: 9, max: 10, cls: "f-high" }
    ];
    const total = state.rows.length || 1;
    const counts = buckets.map(b => {
        const n = state.rows.filter(r => {
            const p = parseFloat(r.puntaje_final);
            return !isNaN(p) && p >= b.min && p <= b.max;
        }).length;
        return {...b, n, pct: Math.round((n / total) * 100) };
    });
    $("#scoreBars").innerHTML = counts.map(b => `
        <div class="score-row">
            <span class="score-label">${b.label}</span>
            <div class="score-track"><i class="score-fill ${b.cls}" data-w="${b.pct}"></i></div>
            <span class="score-count">${b.n}</span>
        </div>`).join("");
    requestAnimationFrame(() => {
        document.querySelectorAll("#scoreBars .score-fill").forEach(f => { f.style.width = f.dataset.w + "%"; });
    });
}

function renderFunnel() {
    const total = state.rows.length;
    const analizados = state.rows.filter(r => has(r.fecha_analizado)).length;
    const aptos = state.rows.filter(r => { const p = parseFloat(r.puntaje_final); return !isNaN(p) && p >= 7; }).length;
    const enviados = state.rows.filter(r => ['enviado', 'seguimiento_pendiente_revision', 'interesado', 'declinado_archivado', 'duda_revisar_manual', 'sin_respuesta_archivado'].includes(r.estado)).length;
    const interesados = state.rows.filter(r => r.clasificacion === 'interesado').length;
    const stages = [
        { label: "Total leads", n: total, color: "var(--cyan)" },
        { label: "Analizados", n: analizados, color: "var(--violet)" },
        { label: "Aptos (≥7)", n: aptos, color: "var(--amber)" },
        { label: "Enviados", n: enviados, color: "var(--accent)" },
        { label: "Interesados", n: interesados, color: "var(--emerald)" }
    ];
    const max = total || 1;
    $("#funnel").innerHTML = stages.map(s => {
        const w = Math.round((s.n / max) * 100);
        return `<div class="funnel-row">
            <span class="funnel-label">${s.label}</span>
            <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:0%;background:${s.color}" data-w="${Math.max(w, s.n > 0 ? 8 : 0)}">${s.n > 0 ? s.n : ''}</div></div>
            <span class="funnel-val">${s.n}</span>
        </div>`;
    }).join("");
    requestAnimationFrame(() => {
        document.querySelectorAll("#funnel .funnel-bar").forEach(b => { b.style.width = b.dataset.w + "%"; });
    });
}

function renderStatesGrid() {
    const counts = {};
    state.rows.forEach(r => {
        const st = r.estado || 'nuevo';
        counts[st] = (counts[st] || 0) + 1;
    });
    const entries = Object.entries(STATE_META).map(([key, meta]) => ({
        key,
        label: meta.label,
        cls: meta.cls,
        n: counts[key] || 0
    })).sort((a, b) => b.n - a.n);
    $("#statesGrid").innerHTML = entries.map(e => `
        <div class="state-chip">
            <span class="num">${e.n}</span>
            <span class="lbl"><span class="dot" style="background:var(--accent)"></span>${esc(e.label)}</span>
        </div>`).join("");
    const dotColors = { 'b-nuevo': 'var(--cyan)', 'b-analizado': 'var(--violet)', 'b-baja': 'var(--text-subtle)', 'b-pendiente': 'var(--amber)', 'b-enviado': 'var(--cyan)', 'b-seg': 'var(--violet)', 'b-interesado': 'var(--emerald)', 'b-declinado': 'var(--rose)', 'b-duda': 'var(--amber)', 'b-sin-respuesta': 'var(--text-subtle)', 'b-descartado': 'var(--text-subtle)' };
    document.querySelectorAll("#statesGrid .state-chip").forEach((chip, i) => {
        const dot = chip.querySelector(".dot");
        if (dot) dot.style.background = dotColors[entries[i].cls] || "var(--accent)";
    });
}

function scoreClass(p) {
    if (p >= 8) return "score-high";
    if (p >= 5) return "score-mid";
    return "score-low";
}

function stateBadge(st) {
    const m = STATE_META[st] || { label: st || '—', cls: 'b-nuevo' };
    return `<span class="badge ${m.cls}"><span class="dot"></span>${esc(m.label)}</span>`;
}

function renderTable() {
    const area = $("#tableArea");
    const rows = state.filtered;
    if (state.rows.length === 0 && !state.loading && !state.error) {
        area.innerHTML = `<div class="state-box"><div class="state-icon">${ICONS.inbox}</div><h3>No hay datos disponibles</h3><p>Supabase devolvió 0 registros en la tabla "${esc(TABLE_NAME)}".</p><button class="btn btn-primary" onclick="fetchData()">${ICONS.refresh} Actualizar</button></div>`;
        $("#pagination").style.display = "none";
        return;
    }
    if (rows.length === 0) {
        area.innerHTML = `<div class="state-box"><div class="state-icon">${ICONS.inbox}</div><h3>Sin resultados</h3><p>No hay registros que coincidan con tu búsqueda o filtro.</p></div>`;
        $("#pagination").style.display = "none";
        return;
    }
    const ps = state.pageSize;
    const pages = Math.ceil(rows.length / ps);
    if (state.page > pages) state.page = pages;
    const start = (state.page - 1) * ps;
    const pageRows = rows.slice(start, start + ps);
    const head = [
        { key: "nombre", label: "Negocio" },
        { key: "categoria", label: "Categoría" },
        { key: "area", label: "Área" },
        { key: "ranking", label: "Ranking" },
        { key: "facilidad_conversion", label: "Conversión" },
        { key: "puntaje_final", label: "Puntaje" },
        { key: "estado", label: "Estado" }
    ];
    const sortIc = (k) => state.sortKey === k ? (state.sortDir === "asc" ? `<span class="sort-ic">${ICONS.up}</span>` : `<span class="sort-ic">${ICONS.down}</span>`) : `<span class="sort-ic">${ICONS.sort}</span>`;
    const thead = head.map(h => `<th class="sortable ${state.sortKey === h.key ? 'active' : ''}" data-sort="${h.key}">${h.label}${sortIc(h.key)}</th>`).join("");
    const tbody = pageRows.map(r => {
        const p = parseFloat(r.puntaje_final);
        const pStr = !isNaN(p) ? p.toFixed(1) : "—";
        const pCls = !isNaN(p) ? scoreClass(p) : "";
        const rk = has(r.ranking) ? r.ranking : "—";
        const fc = has(r.facilidad_conversion) ? r.facilidad_conversion : "—";
        return `<tr data-id="${esc(r.id)}" style="cursor:pointer">
            <td class="cell-name">${esc(dash(r.nombre))}</td>
            <td>${has(r.categoria) ? `<span class="tag tag-cat">${esc(r.categoria)}</span>` : '<span class="cell-dash">—</span>'}</td>
            <td class="${has(r.area) ? '' : 'cell-dash'}">${esc(dash(r.area))}</td>
            <td class="${has(r.ranking) ? '' : 'cell-dash'}">${esc(rk)}</td>
            <td class="${has(r.facilidad_conversion) ? '' : 'cell-dash'}">${esc(fc)}</td>
            <td>${!isNaN(p) ? `<span class="score-pill ${pCls}">${pStr}</span>` : '<span class="cell-dash">—</span>'}</td>
            <td>${stateBadge(r.estado)}</td>
        </tr>`;
    }).join("");
    area.innerHTML = `<div class="table-wrap"><table class="data"><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>
        <div class="mobile-cards">${pageRows.map(r => {
            const p = parseFloat(r.puntaje_final);
            const pStr = !isNaN(p) ? p.toFixed(1) : "—";
            return `<div class="mcard" data-id="${esc(r.id)}">
                <div class="mcard-title">${esc(dash(r.nombre))}</div>
                <div class="mcard-sub">${has(r.categoria) ? esc(r.categoria) : ''} ${has(r.area) ? '· ' + esc(r.area) : ''}</div>
                <div class="mcard-row"><span>Puntaje</span><span>${pStr}</span></div>
                <div class="mcard-row"><span>Ranking</span><span>${esc(dash(r.ranking))}</span></div>
                <div class="mcard-row"><span>Conversión</span><span>${esc(dash(r.facilidad_conversion))}</span></div>
                <div class="mcard-row"><span>Estado</span><span>${stateBadge(r.estado)}</span></div>
            </div>`;
        }).join("")}</div>`;
    renderPagination(pages);
    area.querySelectorAll("tr[data-id], .mcard[data-id]").forEach(el => {
        el.addEventListener("click", () => openDrawer(el.dataset.id));
    });
    area.querySelectorAll("th.sortable").forEach(th => {
        th.addEventListener("click", () => {
            const k = th.dataset.sort;
            if (state.sortKey === k) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
            else { state.sortKey = k;
                state.sortDir = "desc"; }
            applyFilters();
            renderTable();
        });
    });
}

function renderPagination(pages) {
    const pag = $("#pagination");
    if (pages <= 1) { pag.style.display = "none"; return; }
    pag.style.display = "flex";
    $("#pageInfo").textContent = `${((state.page - 1) * state.pageSize) + 1}–${Math.min(state.page * state.pageSize, state.filtered.length)} de ${state.filtered.length}`;
    $("#prevPage").disabled = state.page <= 1;
    $("#nextPage").disabled = state.page >= pages;
    const nums = $("#pageNumbers");
    let html = "";
    const maxBtns = 5;
    let from = Math.max(1, state.page - 2);
    let to = Math.min(pages, from + maxBtns - 1);
    from = Math.max(1, to - maxBtns + 1);
    if (from > 1) html += `<button class="page-btn" data-pg="1">1</button>${from > 2 ? '<span style="color:var(--text-subtle);padding:0 4px">…</span>' : ''}`;
    for (let i = from; i <= to; i++) html += `<button class="page-btn ${i === state.page ? 'active' : ''}" data-pg="${i}">${i}</button>`;
    if (to < pages) html += `${to < pages - 1 ? '<span style="color:var(--text-subtle);padding:0 4px">…</span>' : ''}<button class="page-btn" data-pg="${pages}">${pages}</button>`;
    nums.innerHTML = html;
    nums.querySelectorAll(".page-btn").forEach(b => b.addEventListener("click", () => { state.page = +b.dataset.pg;
        renderTable();
        window.scrollTo({ top: $(".table-panel").offsetTop - 80, behavior: "smooth" }); }));
}

function exportCSV() {
    const rows = state.filtered;
    if (!rows || rows.length === 0) {
        toast("No hay registros para exportar", "error");
        return;
    }
    const cols = ["nombre", "categoria", "area", "email", "telefono", "website",
        "whatsapp", "instagram", "facebook", "ranking", "facilidad_conversion",
        "puntaje_final", "estado", "angulo_venta", "recomendacion"];
    const escCsv = (v) => {
        if (v === null || v === undefined) return "";
        const s = String(v).replace(/"/g, '""');
        return /[",\n]/.test(s) ? `"${s}"` : s;
    };
    const header = cols.join(",");
    const body = rows.map(r => cols.map(c => escCsv(r[c])).join(",")).join("\n");
    const csv = "\uFEFF" + header + "\n" + body;
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `velionix-leads-${stamp}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast(`Se exportaron ${rows.length} registros`, "success");
}

// ============================================================
// EVENTOS
// ============================================================

function bindEvents() {
    $("#refreshBtn").addEventListener("click", fetchData);
    $("#themeBtn").addEventListener("click", () => {
        const cur = document.documentElement.getAttribute("data-theme");
        applyTheme(cur === "dark" ? "light" : "dark");
    });
    $("#exportBtn").addEventListener("click", exportCSV);

    document.addEventListener("click", (e) => {
        const btn = e.target.closest(".copy-btn");
        if (!btn) return;
        const text = btn.dataset.copy;
        navigator.clipboard.writeText(text).then(() => {
            btn.classList.add("copied");
            toast("Copiado al portapapeles", "success");
            setTimeout(() => btn.classList.remove("copied"), 1200);
        }).catch(() => toast("No se pudo copiar", "error"));
    });

    document.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
            e.preventDefault();
            $("#searchInput").focus();
        }
    });
    let searchTimer;
    $("#searchInput").addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        const val = e.target.value;
        searchTimer = setTimeout(() => { state.search = val;
            applyFilters();
            renderTable(); }, 150);
    });
    $("#stateFilter").addEventListener("change", (e) => { state.stateFilter = e.target.value;
        applyFilters();
        renderTable(); });
    $("#categoryFilter").addEventListener("change", (e) => { state.categoryFilter = e.target.value;
        applyFilters();
        renderTable(); });
    const savedSize = localStorage.getItem("velionix-pageSize");
    if (savedSize && [10, 25, 50, 100].includes(+savedSize)) { state.pageSize = +savedSize;
        $("#pageSize").value = savedSize; }
    $("#pageSize").addEventListener("change", (e) => {
        state.pageSize = +e.target.value;
        localStorage.setItem("velionix-pageSize", e.target.value);
        state.page = 1;
        renderTable();
    });
    $("#prevPage").addEventListener("click", () => { if (state.page > 1) { state.page--;
            renderTable(); } });
    $("#nextPage").addEventListener("click", () => { const p = Math.ceil(state.filtered.length / state.pageSize); if (state.page < p) { state.page++;
            renderTable(); } });
    const toTop = $("#toTop");
    window.addEventListener("scroll", () => { if (window.scrollY > 400) toTop.classList.add("show");
        else toTop.classList.remove("show"); }, { passive: true });
    toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    $("#drawerClose").addEventListener("click", closeDrawer);
    $("#drawerOverlay").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
}

// ============================================================
// INICIALIZACIÓN
// ============================================================

function init() {
    initTheme();
    bindEvents();
    renderSkeletons();
    try {
        initSupabase();
    } catch (err) {
        state.error = sanitizeError(err);
        setStatus("error", "Error de conexión");
        renderError();
        toast("No se pudo inicializar Supabase", "error");
        return;
    }
    fetchData();
}
init();

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
}

</script>
